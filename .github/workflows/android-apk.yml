name: Android APK

# Compiling llama.cpp for two ABIs exceeded 40 minutes on a hosted runner, so the
# full APK build runs only when native or build configuration changes on main,
# or when started by hand.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/third_party/**"
      - "android/**/*.gradle.kts"
      - "android/gradle/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug-build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Debug build
        run: ./gradlew :app:assembleDebug --console=plain
